[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nora_evals"]

[project]
name = "nora_evals"
version = "0.0.1"
description = "Public falsification and reliability benchmark suite for evidence, retrieval, orchestration, authorization, and legal-research systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
nora-evals = "nora_evals.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
